name: North America - Canada East Tiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate and publish country tiles
        uses: ./.github/actions/generate-country-tiles
        with:
          country: canada-east
          download_paths: |
            north-america/canada/new-brunswick
            north-america/canada/newfoundland-and-labrador
            north-america/canada/nova-scotia
            north-america/canada/ontario
            north-america/canada/prince-edward-island
            north-america/canada/quebec
          version: ${{ vars.VERSION }}
          routes_token: ${{ secrets.HIKER_ROUTES_TOKEN }}
          tile_password: ${{ secrets.TILE_PASSWORD }}