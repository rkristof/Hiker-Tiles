name: Generate base tiles
description: >
  Generates Shortbread vector tiles for the base layers from the OSM extract

inputs:
  country:
    description: Geofabrik country ID (used to select Latin/non-Latin label rendering)
    required: true

runs:
  using: composite
  steps:
    - name: Install runtime dependencies
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          lua5.3 \
          liblua5.3-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libshp-dev \
          libsqlite3-dev \
          libsqlite3-mod-spatialite \
          libgdal-dev \
          osmium-tool \
          python3-pip \
          python3-dev

    - name: Install GDAL Python bindings
      shell: bash
      run: |
        GDAL_VERSION="$(gdal-config --version)"
        pip3 install \
          --user \
          --break-system-packages \
          --disable-pip-version-check \
          "GDAL==${GDAL_VERSION}"

    - name: Preprocess natural polygons
      shell: bash
      run: |
        diagnostics_dir="${RUNNER_TEMP}/hiker-diagnostics"
        mkdir -p "$diagnostics_dir"
        natural_log="$diagnostics_dir/natural-preprocess.log"
        natural_snapshot() {
          echo "--- natural preprocessing snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ') ---"
          echo "shell_pid=$$ child_pid=${natural_pid:-unknown}"
          if [[ -n "${natural_pid:-}" ]]; then
            ps -o pid,ppid,pgid,sid,rss,vsz,stat,etime,comm,args -p "$natural_pid" || true
            pgrep -a -P "$natural_pid" || true
          fi
          awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
          for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [[ -r "$file" ]]; then
              echo "[$file]"
              cat "$file"
            fi
          done
          ps -eo pid,ppid,pgid,rss,vsz,stat,etime,comm,args --sort=-rss | sed -n '1,12p'
          echo "last natural preprocessing output:"
          tail -n 20 "$natural_log" 2>/dev/null || true
        }
        natural_signal() {
          signal="$1"
          echo "natural preprocessing shell received SIG${signal} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          natural_snapshot | tee -a "$natural_log"
          echo "Last natural preprocessing output:"
          tail -n 80 "$natural_log" 2>/dev/null || true
          if [[ -n "${natural_pid:-}" ]]; then
            kill -TERM "$natural_pid" 2>/dev/null || true
            wait "$natural_pid" 2>/dev/null || true
          fi
          exit $((128 + signal))
        }
        trap 'natural_signal 15' TERM
        trap 'natural_signal 2' INT
        echo "natural-preprocess-start $(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$diagnostics_dir/phase.log"
        set +e
        /usr/bin/time -v python3 -u \
          .github/actions/generate-base-tiles/preprocess_natural.py \
          --input tiles-latest.osm.pbf \
          --output natural-low.geojsonseq \
          --cell-size-meters 300 \
          --min-area-m2 250000 > "$natural_log" 2>&1 &
        natural_pid=$!
        echo "natural preprocessing started pid=$natural_pid pgid=$(ps -o pgid= -p "$natural_pid" | tr -d ' ')" | tee -a "$diagnostics_dir/phase.log"
        while kill -0 "$natural_pid" 2>/dev/null; do
          natural_snapshot | tee -a "$diagnostics_dir/resources.log"
          sleep 30
        done
        wait "$natural_pid"
        preprocess_exit_code=$?
        set -e
        echo "natural preprocessing exited code=${preprocess_exit_code} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$diagnostics_dir/phase.log"
        cat "$natural_log"
        if [[ "$preprocess_exit_code" -ge 128 ]]; then
          echo "natural preprocessing signal=$((preprocess_exit_code - 128))"
          natural_snapshot | tee -a "$diagnostics_dir/resources.log"
        fi
        exit "$preprocess_exit_code"

    - name: Download Tilemaker binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download tilemaker-latest \
          --repo ${{ github.repository }} \
          --pattern 'tilemaker-linux-amd64.tar.gz' \
          --output tilemaker.tar.gz
        tar -xzf tilemaker.tar.gz
        sudo mv tilemaker /usr/local/bin/
        rm tilemaker.tar.gz

    - name: Generate base map tiles
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
      run: |
        tilemaker \
        --config .github/actions/generate-base-tiles/config.json \
        --process .github/actions/generate-base-tiles/process.lua \
        --bbox -180,-90,180,90 \
        --input tiles-latest.osm.pbf \
        --output base.mbtiles \
        --threads "$(getconf _NPROCESSORS_ONLN)"
