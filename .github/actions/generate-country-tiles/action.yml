name: Generate country tiles
description: >
  Generates base and hiking vector tiles for one Geofabrik country and publishes
  the resulting archive to the tiles-latest GitHub Release.

inputs:
  country:
    description: Geofabrik country ID.
    required: true
  symbol_tag:
    description: OSM tag key used to read route symbols (osmc:symbol, jel, or kct).
    required: false
    default: osmc:symbol
  version:
    description: Version identifier written to hiking MBTiles metadata.
    required: true
  routes_token:
    description: Token with read access to the Hiker-Routes repository.
    required: true
  tile_password:
    description: Password used to encrypt the generated tile archive.
    required: true

runs:
  using: composite
  steps:
    - name: Start resource diagnostics
      shell: bash
      run: |
        diagnostics_dir="${RUNNER_TEMP}/hiker-diagnostics"
        mkdir -p "$diagnostics_dir"
        printf 'run=%s\ncountry=%s\nrunner=%s\nstarted=%s\n' \
          "${GITHUB_RUN_ID}" \
          "${{ inputs.country }}" \
          "${RUNNER_NAME}" \
          "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          > "$diagnostics_dir/run-info.txt"
        : > "$diagnostics_dir/phase.log"
        setsid nohup bash -c '
          diagnostics_dir="$1"
          while [[ ! -e "$diagnostics_dir/stop-monitor" ]]; do
            {
              printf "\n=== %s ===\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")"
              awk "/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/" /proc/meminfo
              for file in \
                /sys/fs/cgroup/memory.current \
                /sys/fs/cgroup/memory.peak \
                /sys/fs/cgroup/memory.max \
                /sys/fs/cgroup/memory.events; do
                if [[ -r "$file" ]]; then
                  echo "[$file]"
                  cat "$file"
                fi
              done
              ps -eo pid,ppid,rss,vsz,stat,etime,comm,args --sort=-rss | sed -n "1,20p"
            } >> "$diagnostics_dir/resources.log" 2>&1
            sleep 30
          done
        ' _ "$diagnostics_dir" > /dev/null 2>&1 < /dev/null &
        echo "$!" > "$diagnostics_dir/monitor.pid"

    - name: Fix apt cache permissions
      shell: bash
      run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-packages-v1

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-packages-v1

    - name: Download OSM extract
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
      run: |
        echo "Downloading ${COUNTRY} OSM extract from Geofabrik"
        wget -q \
          "https://download.geofabrik.de/europe/${COUNTRY}-latest.osm.pbf" \
          -O tiles-latest.osm.pbf
        echo "Downloaded: $(du -sh tiles-latest.osm.pbf | cut -f1)"

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends osmium-tool libsqlite3-0 zlib1g libbz2-1.0 libexpat1 liblz4-1
        pip3 install networkx numpy osmium rasterio

    - name: Download native highway collector
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download native-highway-collector-latest \
          --repo ${{ github.repository }} \
          --pattern 'native-highway-collector-linux-amd64.tar.gz' \
          --output /tmp/native-highway-collector.tar.gz
        sudo tar -xzf /tmp/native-highway-collector.tar.gz -C /usr/local/bin
        sudo chmod 0755 /usr/local/bin/native-highway-collector
        rm /tmp/native-highway-collector.tar.gz

    - name: Generate base map tiles
      uses: ./.github/actions/generate-base-tiles
      with:
        country: ${{ inputs.country }}

    - name: Download elevation tiles
      uses: ./.github/actions/download-elevation-tiles
      with:
        country: ${{ inputs.country }}
        output_directory: elevation-tiles

    - name: Checkout route extractor
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Hiker-Routes
        ref: main
        token: ${{ inputs.routes_token }}
        path: .hiker-routes
        persist-credentials: false

    - name: Extract hiking routes with route attributes to GeoJSON
      shell: bash
      env:
        ELEVATION_DIRECTORY: elevation-tiles
        COUNTRY: ${{ inputs.country }}
        SYMBOL_TAG: ${{ inputs.symbol_tag }}
      run: |
        # Keep route geometry and access highways in separate files. The route
        # Native collector retains geometry through three highway adjacency levels.
        osmium tags-filter tiles-latest.osm.pbf \
          r/route=hiking r/route=foot r/route=mtb \
          n/place=city n/place=town n/place=village n/place=hamlet \
          n/natural=peak n/natural=cave_entrance n/natural=volcano \
          n/waterway=waterfall n/natural=spring \
          n/checkpoint=hiking nw/tourism=picnic_site \
          nw/tourism=alpine_hut nw/tourism=wilderness_hut \
          -o tiles-filtered.osm.pbf
        osmium tags-filter tiles-latest.osm.pbf w/highway \
          -o highways-filtered.osm.pbf
        echo "Filtered: $(du -sh tiles-filtered.osm.pbf | cut -f1)"
        diagnostics_dir="${RUNNER_TEMP}/hiker-diagnostics"
        route_log="$diagnostics_dir/route-extraction.log"
        route_snapshot() {
          echo "--- route extraction snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ') ---"
          echo "shell_pid=$$ shell_ppid=$PPID child_pid=${route_pid:-unknown}"
          ps -o pid,ppid,pgid,sid,rss,vsz,stat,etime,comm,args -p $$,$PPID 2>&1 || true
          if [[ -n "${route_pid:-}" ]]; then
            ps -o pid,ppid,pgid,sid,rss,vsz,stat,etime,comm,args -p "$route_pid" || true
            pgrep -a -P "$route_pid" || true
            route_pgid="$(ps -o pgid= -p "$route_pid" 2>/dev/null | tr -d ' ')"
            if [[ -n "$route_pgid" ]]; then
              echo "route process group $route_pgid:"
              ps -eo pid,ppid,pgid,sid,rss,vsz,stat,etime,comm,args | awk -v pgid="$route_pgid" 'NR == 1 || $3 == pgid'
            fi
          fi
          awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
          for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [[ -r "$file" ]]; then
              echo "[$file]"
              cat "$file"
            fi
          done
          ps -eo pid,ppid,pgid,rss,vsz,stat,etime,comm,args --sort=-rss | sed -n '1,12p'
          echo "last route extractor output:"
          tail -n 20 "$route_log" 2>/dev/null || true
        }
        route_signal() {
          signal="$1"
          echo "route extraction shell received SIG${signal} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [[ -n "${route_pid:-}" ]]; then
            kill -0 "$route_pid" 2>&1
            echo "child_alive_check_exit=$?"
            jobs -l || true
          fi
          route_snapshot | tee -a "$diagnostics_dir/resources.log"
          echo "Last route extractor output:"
          tail -n 80 "$route_log" 2>/dev/null || true
          if [[ -n "${route_pid:-}" ]]; then
            kill -TERM "$route_pid" 2>&1
            echo "child_kill_exit=$?"
            wait "$route_pid" 2>&1
            echo "child_wait_exit=$?"
          fi
          rm -rf tiles-filtered.osm.pbf highways-filtered.osm.pbf tiles-latest.osm.pbf elevation-tiles
          exit $((128 + signal))
        }
        trap 'route_signal 15' TERM
        trap 'route_signal 2' INT
        echo "route-extraction-start $(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$diagnostics_dir/phase.log"
        set +e
        /usr/bin/time -v python3 -u .hiker-routes/extract_hiking_routes.py > "$route_log" 2>&1 &
        route_pid=$!
        route_pgid="$(ps -o pgid= -p "$route_pid" | tr -d ' ')"
        echo "route extractor started pid=$route_pid pgid=$route_pgid shell_pid=$$ shell_ppid=$PPID" | tee -a "$diagnostics_dir/phase.log"
        while kill -0 "$route_pid" 2>/dev/null; do
          route_snapshot | tee -a "$diagnostics_dir/resources.log"
          sleep 30
        done
        if kill -0 "$route_pid" 2>/dev/null; then
          echo "child_alive_after_monitor_loop=yes" | tee -a "$diagnostics_dir/phase.log"
        else
          echo "child_alive_after_monitor_loop=no kill_check_exit=$?" | tee -a "$diagnostics_dir/phase.log"
        fi
        wait "$route_pid"
        route_exit_code=$?
        set -e
        echo "route extractor exited code=${route_exit_code} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$diagnostics_dir/phase.log"
        cat "$route_log"
        if [[ "$route_exit_code" -ge 128 ]]; then
          echo "route extractor signal=$((route_exit_code - 128))"
          route_snapshot | tee -a "$diagnostics_dir/resources.log"
        fi
        if [[ "$route_exit_code" -ne 0 ]]; then
          rm -rf tiles-filtered.osm.pbf highways-filtered.osm.pbf tiles-latest.osm.pbf elevation-tiles
          exit "$route_exit_code"
        fi
        rm -rf tiles-filtered.osm.pbf highways-filtered.osm.pbf tiles-latest.osm.pbf elevation-tiles
        echo "Natural points: $(wc -l < natural-points.geojsonseq)"
        echo "Route lines: $(wc -l < hiking-routes.geojsonseq)"
        echo "Symbol lines: $(wc -l < hiking-symbols.geojsonseq)"
        echo "Route lines: $(wc -l < hiking-routes-interaction.geojsonseq)"
        echo "Unique OSMC symbols: $(wc -l < osmc-symbols.txt)"

    - name: Download Tippecanoe binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download tippecanoe-latest \
          --repo ${{ github.repository }} \
          --pattern 'tippecanoe-linux-amd64.tar.gz' \
          --output tippecanoe.tar.gz
        tar -xzf tippecanoe.tar.gz
        sudo install -m 0755 tippecanoe /usr/local/bin/tippecanoe
        rm tippecanoe tippecanoe.tar.gz
        tippecanoe --version

    - name: Generate vector tiles with Tippecanoe
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
      run: |
        tippecanoe \
          --output hiking.mbtiles \
          --minimum-zoom 5 \
          --maximum-zoom 13 \
          --low-detail 9 \
          --simplification 0.5 \
          --reorder \
          --hilbert \
          --coalesce \
          --single-precision \
          --no-tile-size-limit \
          --force \
          --named-layer=natural_points:natural-points.geojsonseq \
          --named-layer=hiking_routes_interaction:hiking-routes-interaction.geojsonseq \
          --named-layer=hiking_routes:hiking-routes.geojsonseq \
          --named-layer=hiking_symbols:hiking-symbols.geojsonseq
        mv hiking.mbtiles "${COUNTRY}-hiking.mbtiles"
        echo "Hiking: $(du -sh "${COUNTRY}-hiking.mbtiles" | cut -f1)"
        rm natural-points.geojsonseq \
          hiking-routes.geojsonseq \
          hiking-symbols.geojsonseq \
          hiking-routes-interaction.geojsonseq
        cp base.mbtiles "${COUNTRY}-base.mbtiles"
        echo "Base: $(du -sh "${COUNTRY}-base.mbtiles" | cut -f1)"

    - name: Inject routes metadata table into MBTiles
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
        VERSION: ${{ inputs.version }}
      run: |
        python3 .hiker-routes/inject_routes_metadata.py \
          routes-meta.json "${COUNTRY}-hiking.mbtiles" "$VERSION"
        rm routes-meta.json

    - name: Generate and embed OSMC symbol images
      uses: ./.github/actions/embed-osmc-symbols
      with:
        filename: ${{ inputs.country }}-hiking.mbtiles
        embed_kct_symbols: ${{ inputs.symbol_tag == 'kct' }}
        embed_jel_symbols: ${{ inputs.symbol_tag == 'jel' }}

    - name: Compress tiles
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
      run: tar -czf "${COUNTRY}-tiles.tar.gz" "${COUNTRY}-base.mbtiles" "${COUNTRY}-hiking.mbtiles"

    - name: Encrypt tiles archive
      shell: bash
      env:
        COUNTRY: ${{ inputs.country }}
        TILE_PASSWORD: ${{ inputs.tile_password }}
      run: |
        openssl enc -aes-256-cbc \
          -pbkdf2 \
          -iter 600000 \
          -md sha256 \
          -salt \
          -pass env:TILE_PASSWORD \
          -in "${COUNTRY}-tiles.tar.gz" \
          -out "${COUNTRY}-tiles.tar.gz.enc"
        rm "${COUNTRY}-tiles.tar.gz"

    - name: Publish to GitHub Releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COUNTRY: ${{ inputs.country }}
      run: |
        NOTES="Auto-generated map tiles from OpenStreetMap data (ODbL).
        Source: Geofabrik extracts
        Updated: $(date -u '+%Y-%m-%d %H:%M UTC')"

        if gh release view tiles-latest &>/dev/null; then
          gh release upload tiles-latest "${COUNTRY}-tiles.tar.gz.enc" --clobber
          gh release edit tiles-latest --notes "$NOTES"
        else
          gh release create tiles-latest \
            --title "Tiles (Latest)" \
            --notes "$NOTES" \
            "${COUNTRY}-tiles.tar.gz.enc"
        fi

    - name: Collect resource diagnostics
      if: ${{ always() }}
      shell: bash
      run: |
        diagnostics_dir="${RUNNER_TEMP}/hiker-diagnostics"
        mkdir -p "$diagnostics_dir"
        {
          printf 'finished=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'job_status=%s\n' "${{ job.status }}"
          printf '\n=== cgroup memory events ===\n'
          for file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak; do
            if [[ -r "$file" ]]; then
              echo "[$file]"
              cat "$file"
            fi
          done
          printf '\n=== kernel warnings and errors ===\n'
          dmesg --level=warning,err 2>&1 | tail -n 200 || true
        } > "$diagnostics_dir/final-diagnostics.txt"
        touch "$diagnostics_dir/stop-monitor"
        if [[ -s "$diagnostics_dir/monitor.pid" ]]; then
          monitor_pid="$(cat "$diagnostics_dir/monitor.pid")"
          kill -- "-${monitor_pid}" 2>/dev/null || kill "$monitor_pid" 2>/dev/null || true
          for _ in {1..5}; do
            kill -0 "$monitor_pid" 2>/dev/null || break
            sleep 1
          done
        fi

    - name: Upload resource diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: hiker-diagnostics-${{ inputs.country }}-${{ github.run_id }}
        path: ${{ runner.temp }}/hiker-diagnostics
        if-no-files-found: warn
        retention-days: 7
